<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada — Paulo Crespo</title>
<meta name="description" content="Esta página no existe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
  // Stamp the theme before first paint, otherwise the light palette shows
  // for a frame on every load. An explicit choice always beats the OS.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('site_theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    /* Pairing 7a — pink ground, yellow accent. Values taken verbatim from
       the design doc so the site and the mock stay in sync. */
    /* Unstyled UA widgets (bare <button>, scrollbars, form controls) pick
       their colours from color-scheme. Without this it follows the OS, so a
       light theme on a dark-mode OS rendered white button text on pale pink. */
    color-scheme: light;
    --ground: oklch(0.42 0.11 350);        /* the pink card ground */
    --ground-deep: oklch(0.33 0.10 350);   /* one step down, for stacking */
    --ground-soft: oklch(0.94 0.02 350);   /* pale pink, light sections */
    --on-ground-soft: oklch(0.42 0.11 350); /* text on --ground-soft */
    --link: oklch(0.42 0.11 350);          /* brand pink as text on paper */
    --on-ground: oklch(0.97 0.01 350);     /* near-white text on pink */
    --accent: oklch(0.85 0.17 95);         /* the yellow */
    --accent-ink: oklch(0.18 0.02 95);     /* text sitting on yellow */
    --paper: oklch(0.98 0.008 350);
    --paper-alt: oklch(0.94 0.02 350);
    --ink: oklch(0.24 0.05 350);
    --ink-soft: oklch(0.47 0.04 350);
    --line: oklch(0.24 0.05 350 / 0.14);
    --line-on-ground: oklch(0.97 0.01 350 / 0.15);
    --surface: #FFFFFF;

    /* Semantic colours are tokens so the dark theme can restate them once,
       instead of every call site hardcoding a light-mode hex. */
    --danger: #B3261E;
    --danger-hover: #8C1D18;
    --danger-bg: #FCE8E6;
    --danger-line: #E7C3BF;
    --success: #2F6B45;
    --success-bg: #E7F4EC;
    --success-line: #BFE0CC;
  }
  /* ---- Dark theme ---------------------------------------------------
     data-theme is stamped on <html> before first paint (see the script in
     <head>), so this block is the single source of truth for dark and no
     frame of the light palette ever shows. The yellow accent is left
     unchanged on purpose: it already carries its contrast on a dark
     ground, and holding it constant is what keeps both themes reading as
     one identity rather than two skins. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: oklch(0.46 0.12 350);
    --ground-deep: oklch(0.36 0.10 350);
    --ground-soft: oklch(0.26 0.04 350);
    --on-ground-soft: oklch(0.88 0.05 350);
    --link: oklch(0.80 0.11 350);
    --on-ground: oklch(0.97 0.01 350);
    --accent: oklch(0.85 0.17 95);
    --accent-ink: oklch(0.18 0.02 95);
    --paper: oklch(0.16 0.018 350);
    --paper-alt: oklch(0.21 0.025 350);
    --ink: oklch(0.95 0.012 350);
    --ink-soft: oklch(0.74 0.02 350);
    --line: oklch(0.95 0.012 350 / 0.16);
    --line-on-ground: oklch(0.97 0.01 350 / 0.18);
    --surface: oklch(0.20 0.022 350);

    --danger: oklch(0.68 0.17 25);
    --danger-hover: oklch(0.60 0.17 25);
    --danger-bg: oklch(0.26 0.05 25);
    --danger-line: oklch(0.40 0.08 25);
    --success: oklch(0.78 0.13 155);
    --success-bg: oklch(0.24 0.04 155);
    --success-line: oklch(0.38 0.06 155);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.44);
    --shadow-md: 0 4px 16px -4px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.34);
    --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, 0.62), 0 4px 10px rgba(0, 0, 0, 0.38);
  }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; margin-left: 4px;
    font-family: inherit; font-size: 0.95rem; line-height: 1;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 5px;
    cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* On the pink header band the toggle sits on --on-ground, not --ink. */
  header .theme-toggle { color: var(--on-ground); border-color: var(--line-on-ground); }
  header .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .back-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; line-height: 1.65; }
  h1, h2, h3 { font-family: 'Archivo Black', system-ui, sans-serif; font-weight: 400; margin: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }
  a.back { display: inline-block; margin-bottom: 24px; color: var(--ink-soft); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--link); }
  h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin-bottom: 12px; }
  .lede { color: var(--ink-soft); font-size: 1.05rem; margin-bottom: 40px; }
  h2 { font-size: 1.3rem; margin-top: 40px; margin-bottom: 14px; }
  p { margin: 0 0 14px; }
  ol, ul { padding-left: 22px; margin: 0 0 14px; }
  li { margin-bottom: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px; margin: 20px 0; }
  .paused-notice {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 22px;
    font-size: 0.92rem; font-weight: 600;
  }
  .disclaimer { background: var(--ground-soft); border-radius: 10px; padding: 16px 20px; font-size: 0.9rem; color: var(--on-ground-soft); margin-top: 40px; }
  .mono { font-family: 'Inter', system-ui, sans-serif; font-size: 0.85rem; background: var(--paper-alt); padding: 2px 6px; border-radius: 4px; }
  .lang-btn {
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    font-size: 0.78rem; font-weight: 600; padding: 4px 8px; border-radius: 5px; cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif; margin-left: 4px;
  }
  .lang-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---- Under-development banner ---- */
  .dev-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 9px 44px 9px 16px;
    background: var(--paper-alt);
    color: var(--ink-soft);
    font-size: 0.8rem;
    line-height: 1.4;
    text-align: center;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .dev-banner-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .dev-banner-close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font-size: 1.1rem; line-height: 1;
    padding: 4px 8px; border-radius: 4px;
  }
  .dev-banner-close:hover { background: var(--line); }
</style>
<body>
<div class="wrap" style="min-height: 72vh; display: flex; flex-direction: column; justify-content: center; text-align: center;">
  <p class="mono" style="font-size: 0.8rem; letter-spacing: 0.16em; color: var(--ink-soft); margin-bottom: 10px;">404</p>
  <h1 style="margin-bottom: 14px;">¿Cómo has llegado aquí?</h1>
  <p class="lede" style="margin-bottom: 28px;">
    Esta página no existe — puede que el enlace estuviera roto o que la dirección tenga una errata.
    No pasa nada, se vuelve fácil.
  </p>
  <p>
    <a class="btn" href="/">Volver a la página principal</a>
  </p>
  <p style="margin-top: 22px; font-size: 0.88rem; color: var(--ink-soft);">
    ¿Buscabas algo en concreto?
    <a href="/cuenta.html" style="color: var(--link);">Tu cuenta</a> ·
    <a href="/blog.html" style="color: var(--link);">Blog</a> ·
    <a href="mailto:yankxwtic@mozmail.com" style="color: var(--link);">Escríbeme</a>
  </p>
</div>

<script>
  function toggleTheme() {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('site_theme', next); } catch (e) {}
  }
</script>
</body>
</html>
